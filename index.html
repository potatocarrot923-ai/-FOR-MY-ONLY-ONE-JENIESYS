<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Only One Jeniesys</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #333;
    }

    /* Container Box */
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 40px;
      max-width: 450px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      z-index: 10;
      position: relative;
    }

    h1 {
      color: #d63384;
      font-size: 2rem;
      margin-bottom: 15px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #555;
      margin-bottom: 25px;
    }

    /* Music Control Button */
    .btn {
      background-color: #d63384;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(214, 51, 132, 0.4);
      transition: all 0.3s ease;
      outline: none;
    }

    .btn:hover {
      background-color: #b02a6f;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(214, 51, 132, 0.6);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Floating Hearts Animation */
    .heart {
      position: absolute;
      bottom: -10vh;
      font-size: 1.5rem;
      color: #ff4d6d;
      animation: float 6s linear infinite;
      z-index: 1;
      opacity: 0.7;
    }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.8;
      }
      100% {
        transform: translateY(-105vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Audio Element using Raw Github Stream URL -->
  <audio 
    id="bgMusic" 
    src="https://raw.githubusercontent.com/potatocarrot923-ai/-FOR-MY-ONLY-ONE-JENIESYS/main/Willie%20Revillame%20-%20Syempre%20(Official%20Lyric%20Video).mp3" 
    loop 
    preload="auto">
  </audio>

  <!-- Main Card -->
  <div class="card">
    <h1>For Jeniesys ❤️</h1>
    <p>Press play below to start the background music!</p>
    <button class="btn" id="musicBtn">🎵 Play Music</button>
  </div>

  <script>
    const audio = document.getElementById('bgMusic');
    const button = document.getElementById('musicBtn');

    // Toggle Audio Play/Pause
    button.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().then(() => {
          button.textContent = "⏸️ Pause Music";
        }).catch(err => {
          console.error("Audio playback error:", err);
        });
      } else {
        audio.pause();
        button.textContent = "🎵 Play Music";
      }
    });

    // Optional: Auto-start music on first page click anywhere
    window.addEventListener('click', (e) => {
      // Avoid triggering if clicking the button directly (handled above)
      if (e.target === button) return;

      if (audio.paused) {
        audio.play().then(() => {
          button.textContent = "⏸️ Pause Music";
        }).catch(() => {
          // Suppress browser autoplay restrictions
        });
      }
    }, { once: true });

    // Floating Hearts Generator
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 3 + 4 + 's';
      heart.style.fontSize = Math.random() * 15 + 15 + 'px';
      
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 7000);
    }

    setInterval(createHeart, 400);
  </script>
</body>
</html>
