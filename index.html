<!-- =========================
     CREATIVE DREAM-SKY BACKGROUND
========================= -->

<div class="dream-background" aria-hidden="true">

```
<div class="moon">
    <div class="moon-glow"></div>
</div>

<div class="aurora aurora-one"></div>
<div class="aurora aurora-two"></div>
<div class="aurora aurora-three"></div>

<div class="stars" id="stars"></div>

<div class="cloud cloud-one"></div>
<div class="cloud cloud-two"></div>

<div class="petals" id="petals"></div>
```

</div>

<style>

/* =========================
   DREAM BACKGROUND
========================= */

body {
    background: #090914;
    color: #fff;
    position: relative;
}

/* Full background layer */

.dream-background {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(126, 72, 145, .35),
            transparent 28%
        ),
        radial-gradient(
            circle at 10% 80%,
            rgba(220, 73, 137, .22),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 70%,
            rgba(83, 101, 194, .25),
            transparent 32%
        ),
        linear-gradient(
            180deg,
            #080814 0%,
            #111027 45%,
            #24142d 100%
        );
}

/* =========================
   MOON
========================= */

.moon {
    position: absolute;

    width: 110px;
    height: 110px;

    top: 9%;
    right: 11%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff,
            #ffeaf4 55%,
            #eab6cf 100%
        );

    box-shadow:
        0 0 25px rgba(255,235,246,.8),
        0 0 70px rgba(255,192,220,.45),
        0 0 140px rgba(255,130,187,.2);

    animation: moonFloat 7s ease-in-out infinite;
}

.moon::before,
.moon::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: rgba(194,142,165,.18);
}

.moon::before {
    width: 18px;
    height: 18px;
    left: 23px;
    top: 28px;
}

.moon::after {
    width: 11px;
    height: 11px;
    right: 22px;
    bottom: 27px;
}

@keyframes moonFloat {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }

}

/* Moon halo */

.moon-glow {
    position: absolute;
    inset: -45px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,201,225,.22),
            transparent 65%
        );

    filter: blur(10px);
}

/* =========================
   AURORA
========================= */

.aurora {
    position: absolute;

    width: 90%;
    height: 35%;

    left: 5%;

    border-radius: 50%;

    filter: blur(35px);

    opacity: .45;

    transform: rotate(-8deg);

    mix-blend-mode: screen;
}

.aurora-one {
    top: 18%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(226,87,167,.55),
            rgba(112,94,211,.45),
            transparent
        );

    animation: auroraMove 10s ease-in-out infinite;
}

.aurora-two {
    top: 29%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(83,185,206,.25),
            rgba(210,92,185,.45),
            transparent
        );

    transform: rotate(8deg);

    animation:
        auroraMoveReverse
        13s ease-in-out infinite;
}

.aurora-three {
    top: 42%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,130,188,.25),
            rgba(116,95,205,.35),
            transparent
        );

    animation:
        auroraMove
        16s ease-in-out infinite;
}

@keyframes auroraMove {

    0%,100% {
        transform:
            translateX(-8%)
            rotate(-8deg)
            scale(1);
    }

    50% {
        transform:
            translateX(8%)
            rotate(-3deg)
            scale(1.15);
    }

}

@keyframes auroraMoveReverse {

    0%,100% {
        transform:
            translateX(8%)
            rotate(8deg)
            scale(1.1);
    }

    50% {
        transform:
            translateX(-8%)
            rotate(3deg)
            scale(1);
    }

}

/* =========================
   STARS
========================= */

.stars {
    position: absolute;
    inset: 0;
}

.star {
    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: #fff;

    box-shadow:
        0 0 6px #fff,
        0 0 12px rgba(255,190,220,.8);

    animation: twinkle var(--duration) ease-in-out infinite;
}

@keyframes twinkle {

    0%,100% {
        opacity: .2;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.7);
    }

}

/* =========================
   CLOUDS
========================= */

.cloud {
    position: absolute;

    width: 350px;
    height: 100px;

    border-radius: 50%;

    background:
        rgba(255,185,215,.055);

    filter: blur(20px);

    animation: cloudMove linear infinite;
}

.cloud-one {
    top: 35%;
    left: -400px;
    animation-duration: 45s;
}

.cloud-two {
    top: 65%;
    left: -500px;
    animation-duration: 60s;
    animation-delay: 10s;
}

@keyframes cloudMove {

    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(150vw);
    }

}

/* =========================
   FLOATING PETALS
========================= */

.petals {
    position: absolute;
    inset: 0;
}

.petal {
    position: absolute;

    width: 9px;
    height: 15px;

    border-radius:
        80% 20% 80% 20%;

    background:
        linear-gradient(
            135deg,
            rgba(255,178,211,.85),
            rgba(214,83,139,.35)
        );

    filter: blur(.2px);

    animation:
        petalFall
        var(--fall)
        linear infinite;

    opacity: 0;
}

@keyframes petalFall {

    0% {
        opacity: 0;
        transform:
            translateY(-30px)
            translateX(0)
            rotate(0deg);
    }

    10% {
        opacity: .8;
    }

    50% {
        transform:
            translateY(50vh)
            translateX(80px)
            rotate(180deg);
    }

    90% {
        opacity: .5;
    }

    100% {
        opacity: 0;
        transform:
            translateY(110vh)
            translateX(-80px)
            rotate(360deg);
    }

}

/* =========================
   CONTENT LAYER
========================= */

.container {
    position: relative;
    z-index: 10;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.90),
            rgba(255,240,247,.78)
        );

    color: #53323e;

    box-shadow:
        0 30px 100px rgba(0,0,0,.35),
        0 0 60px rgba(255,125,181,.10);

    border:
        1px solid rgba(255,255,255,.75);

}

/* =========================
   MOBILE
========================= */

@media (max-width:600px) {

    .moon {
        width: 70px;
        height: 70px;

        top: 6%;
        right: 7%;
    }

    .aurora {
        width: 140%;
        left: -20%;
    }

    .cloud {
        opacity: .5;
    }

}

/* =========================
   REDUCED MOTION
========================= */

@media (prefers-reduced-motion: reduce) {

    .moon,
    .aurora,
    .cloud,
    .star,
    .petal {
        animation: none !important;
    }

}

</style>

<script>

/* =========================
   GENERATE STARS
========================= */

(function createStars() {

    const container =
        document.getElementById("stars");

    if (!container) return;

    const amount =
        window.innerWidth < 600 ? 55 : 110;

    for (let i = 0; i < amount; i++) {

        const star =
            document.createElement("span");

        star.className = "star";

        star.style.left =
            Math.random() * 100 + "%";

        star.style.top =
            Math.random() * 100 + "%";

        star.style.setProperty(
            "--duration",
            (2 + Math.random() * 4) + "s"
        );

        star.style.animationDelay =
            Math.random() * 5 + "s";

        const size =
            Math.random() < .15
                ? 3
                : 1 + Math.random() * 1.5;

        star.style.width = size + "px";
        star.style.height = size + "px";

        container.appendChild(star);

    }

})();

/* =========================
   GENERATE PETALS
========================= */

(function createPetals() {

    const container =
        document.getElementById("petals");

    if (!container) return;

    const amount =
        window.innerWidth < 600 ? 12 : 20;

    for (let i = 0; i < amount; i++) {

        const petal =
            document.createElement("span");

        petal.className = "petal";

        petal.style.left =
            Math.random() * 100 + "%";

        petal.style.setProperty(
            "--fall",
            (8 + Math.random() * 10) + "s"
        );

        petal.style.animationDelay =
            Math.random() * 12 + "s";

        petal.style.transform =
            `scale(${.5 + Math.random()})`;

        container.appendChild(petal);

    }

})();

</script>
