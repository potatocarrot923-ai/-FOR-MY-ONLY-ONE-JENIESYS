<!-- =========================
     ANNIVERSARY MUSIC
========================= -->

<audio id="backgroundMusic" preload="auto" loop>
    <source src="./Sympre Ikaw Lang - Wellie.mp3" type="audio/mpeg">
</audio>

<audio id="specialMusic" preload="auto">
    <source src="./Shania Twain - You're Still The One (Lyrics).mp3" type="audio/mpeg">
</audio>

<script>
/* =========================
   MUSIC CONTROLLER
   ========================= */

(function () {

    const backgroundMusic =
        document.getElementById("backgroundMusic");

    const specialMusic =
        document.getElementById("specialMusic");

    if (!backgroundMusic || !specialMusic) return;

    let backgroundWasPlaying = false;
    let musicStarted = false;

    /*
     * Start background music after the visitor
     * interacts with the page.
     */
    function startBackgroundMusic() {

        if (musicStarted) return;

        musicStarted = true;

        backgroundMusic.play().catch(() => {
            /*
             * Browser blocked autoplay.
             * The next user interaction will retry.
             */
            musicStarted = false;
        });
    }

    /*
     * Try to start music after any normal
     * user interaction.
     */
    function userInteraction() {

        if (
            specialMusic.paused &&
            backgroundMusic.paused
        ) {
            startBackgroundMusic();
        }

    }

    [
        "click",
        "touchstart",
        "pointerdown",
        "keydown"
    ].forEach(eventName => {

        document.addEventListener(
            eventName,
            userInteraction,
            {
                once: false,
                passive: true
            }
        );

    });

    /*
     * SPECIAL SONG STARTS
     *
     * Save whether background music was playing,
     * then immediately pause it.
     */
    specialMusic.addEventListener(
        "play",
        function () {

            backgroundWasPlaying =
                !backgroundMusic.paused &&
                !backgroundMusic.ended;

            backgroundMusic.pause();

        }
    );

    /*
     * Extra overlap protection.
     * Even if another script calls specialMusic.play(),
     * background music will be stopped.
     */
    specialMusic.addEventListener(
        "playing",
        function () {

            if (!backgroundMusic.paused) {
                backgroundWasPlaying = true;
                backgroundMusic.pause();
            }

        }
    );

    /*
     * SPECIAL SONG PAUSED
     *
     * Resume background at its exact previous
     * position if it was playing before.
     */
    specialMusic.addEventListener(
        "pause",
        function () {

            if (
                !specialMusic.ended &&
                backgroundWasPlaying
            ) {

                backgroundMusic
                    .play()
                    .catch(() => {});

            }

        }
    );

    /*
     * SPECIAL SONG FINISHED
     *
     * Resume background music without changing
     * its currentTime.
     */
    specialMusic.addEventListener(
        "ended",
        function () {

            if (backgroundWasPlaying) {

                backgroundMusic
                    .play()
                    .catch(() => {});

            }

            backgroundWasPlaying = false;

        }
    );

    /*
     * Public helper functions.
     * These let your existing buttons control
     * the special song without creating overlap.
     */

    window.playSpecialMusic = function () {

        backgroundWasPlaying =
            !backgroundMusic.paused &&
            !backgroundMusic.ended;

        backgroundMusic.pause();

        specialMusic
            .play()
            .catch(() => {});

    };

    window.pauseSpecialMusic = function () {

        specialMusic.pause();

    };

    window.stopSpecialMusic = function () {

        specialMusic.pause();
        specialMusic.currentTime = 0;

    };

})();
</script>
